name: Economic cycle components
on:
  workflow_dispatch:
  schedule:
    - cron: '45 15 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/update_cycle_components.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cycle_components.json
          git diff --cached --quiet || (git commit -m "Refresh public economic cycle components" && git push)
