name: Update and publish CFO Macro RD

on:
  workflow_dispatch:
  schedule:
  # Cada hora entre 6:17 AM y 10:17 PM de Santo Domingo (UTC-4).
  # Minuto 17 para evitar concentrar ejecuciones al inicio de la hora.
  - cron: "17 10-23 * * *"
  - cron: "17 0-2 * * *"
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/update_data.py
        continue-on-error: true
      - run: python scripts/update_usa.py
        continue-on-error: true
      - run: python scripts/update_economic_cycle.py
        continue-on-error: true
      - run: python scripts/update_gdp.py
        continue-on-error: true
      - run: python scripts/update_inputs.py
        continue-on-error: true
      - run: python scripts/update_economy_news.py
      - run: python scripts/update_news.py
      - name: Save validated data/health status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/history.json data/usa.json data/news.json data/economy_news.json data/gdp.json data/inputs.json data/economic_cycle.json
          git diff --cached --quiet || git commit -m "Automated macro data check"
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
