name: Update and publish CFO Macro RD

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 11:15 UTC ~= 7:15 AM Santo Domingo.
    - cron: "15 11 * * 1-5"
    - cron: "0 17 * * 1-5"
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - name: Save validated data/health status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/history.json
          git diff --cached --quiet || git commit -m "Automated macro data check"
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
