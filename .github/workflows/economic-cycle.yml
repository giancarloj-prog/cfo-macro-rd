name: Economic cycle public data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 15 * * 1-5'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/update_economic_cycle.py
      - name: Commit observations only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/economic_cycle.json
          git diff --cached --quiet || (git commit -m "Update economic cycle source status" && git push)
